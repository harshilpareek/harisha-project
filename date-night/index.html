/* ---------- Keys / helpers ---------- */
const LS = {
  local: "hs_local_v1", theme: "hs_theme_v1", cfg: "hs_cfg_v1", tab: "hs_tab_v1",
};
const $ = (s, r=document) => r.querySelector(s);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const budgetLabel = b => ["Free","$","$$","$$$"][b] ?? "$$";
const settingLabel = s => ({home:"At home",out:"Out & about",outdoors:"Outdoors"})[s] || "Out & about";
const timeLabel = t => ({day:"Daytime",evening:"Evening",late:"Late night",any:"Anytime"})[t] || "Evening";
const HAND_SIZE = 7;

let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }

function timeAgo(iso){
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s/60)}m ago`;
  if (s < 86400) return `${Math.round(s/3600)}h ago`;
  return `${Math.round(s/86400)}d ago`;
}

/* ============================================================
   LOCAL STORE — both perspectives on one device
   ============================================================ */
function blankLocal(){
  return {
    people: [
      { slot:"a", name:"Harshil", color:"indigo" },
      { slot:"b", name:"Isha",    color:"rose"   },
    ],
    active: "a",
    reactions: { a:{}, b:{} },   // slot -> { ideaKey: 'yes'|'maybe'|'pass' }
    ideas: {},                   // ideaKey -> {title, blurb, meta, source...}
    plan: null, log: [], area: null, finds: null, lastSweep: null,
  };
}
function L(){ const v = lsGet(LS.local, null); return v || blankLocal(); }
function saveL(v){ lsSet(LS.local, v); }

/* ============================================================
   API — one interface, two implementations
   ============================================================ */
const localApi = {
  mode: "local",
  async init(){
    const d = L();
    const me = d.people.find(p => p.slot === d.active) || d.people[0];
    const partner = d.people.find(p => p.slot !== d.active) || null;
    state.me = { id: me.slot, name: me.name, color: me.color, slot: me.slot };
    state.partner = partner ? { id: partner.slot, name: partner.name, color: partner.color } : null;
    state.area = d.area; state.lastSweep = d.lastSweep;
    state.plan = d.plan; state.log = d.log || [];
    state.finds = d.finds || SAMPLE_FINDS;
  },
  async myReactions(){
    const d = L(), mine = d.reactions[d.active] || {};
    return Object.entries(mine).map(([key, reaction]) => ({ key, reaction, ...(d.ideas[key]||{}) }));
  },
  async react(card, reaction){
    const d = L();
    d.reactions[d.active] = d.reactions[d.active] || {};
    d.reactions[d.active][card.key] = reaction;
    d.ideas[card.key] = { title: card.title, blurb: card.blurb, meta: card.meta, source_label: card.source_label, source_url: card.source_url };
    saveL(d);
  },
  async pendingForMe(){
    const d = L();
    const mine = d.reactions[d.active] || {};
    const other = d.reactions[d.active === "a" ? "b" : "a"] || {};
    return Object.keys(other).filter(k => !(k in mine)).map(k => ({ key:k, ...(d.ideas[k]||{}) }));
  },
  async consensus(){
    const d = L();
    const mine = d.reactions[d.active] || {};
    const other = d.reactions[d.active === "a" ? "b" : "a"] || {};
    const theirName = (d.people.find(p=>p.slot !== d.active) || {}).name || "your partner";
    return Object.keys(mine).filter(k => k in other).map(k => ({
      key:k, mine: mine[k], theirs: other[k], theirName, ...(d.ideas[k]||{})
    }));
  },
  async progress(){
    const d = L();
    const mine = d.reactions[d.active] || {};
    const other = d.reactions[d.active === "a" ? "b" : "a"] || {};
    const both = Object.keys(mine).filter(k => k in other).length;
    return {
      myVotes: Object.keys(mine).length,
      theirVotes: Object.keys(other).length,
      bothVoted: both,
      waitingOnMe: Object.keys(other).filter(k => !(k in mine)).length,
      theirName: (d.people.find(p=>p.slot !== d.active) || {}).name || "your partner",
    };
  },
  async partnerReactions(){   // local-only: powers the "how you compare" chart
    const d = L();
    const other = d.reactions[d.active === "a" ? "b" : "a"] || {};
    return Object.entries(other).map(([key, reaction]) => ({ key, reaction, ...(d.ideas[key]||{}) }));
  },
  async getFinds(){ const d = L(); return d.finds || SAMPLE_FINDS; },
  async setArea(area){ const d = L(); d.area = area; saveL(d); state.area = area; },
  async sweep(){ throw new Error("Live scouting needs the Supabase backend — see Settings → Connect a backend."); },
  async setPlan(plan){ const d = L(); d.plan = plan; saveL(d); state.plan = plan; },
  async clearPlan(){ const d = L(); d.plan = null; saveL(d); state.plan = null; },
  async completePlan(){
    const d = L();
    if (d.plan){ d.log = [{ ...d.plan, done_at: new Date().toISOString() }, ...(d.log||[])]; d.plan = null; saveL(d); }
    state.plan = null; state.log = d.log || [];
  },
};

const backendApi = {
  mode: "backend",
  async init(){
    const { data: prof } = await state.sb.rpc("bootstrap_profile", { p_name: null, p_color: null });

  async myReactions(){

    return (data||[]).map(r => ({ key:r.idea_key, title:r.idea_title, blurb:r.idea_blurb, meta:r.idea_meta, reaction:r.reaction }));
  },
  async react(card, reaction){
    await state.sb.from("reactions").upsert({
      couple_id: state.coupleId, user_id: state.user.id, idea_key: card.key,
      idea_title: card.title, idea_blurb: card.blurb, idea_meta: card.meta, reaction,
    }, { onConflict: "user_id,idea_key" });

  async pendingForMe(){
    const { data } = await state.sb.rpc("pending_for_me");
    return (data||[]).map(r => ({ key:r.idea_key, title:r.idea_title, blurb:r.idea_blurb, meta:r.idea_meta }));
  },
  async consensus(){
    const { data } = await state.sb.rpc("get_consensus");
    return (data||[]).map(r => ({
      key:r.idea_key, title:r.idea_title, blurb:r.idea_blurb, meta:r.idea_meta,
      mine:r.my_reaction, theirs:r.their_reaction, theirName:r.their_name,
    }));
  },
  async progress(){
    const { data } = await state.sb.rpc("vote_progress");
    const r = Array.isArray(data) ? data[0] : data;
    return r ? { myVotes:r.my_votes, theirVotes:r.their_votes, bothVoted:r.both_voted, waitingOnMe:r.waiting_on_me, theirName:r.their_name } : null;
  },
  async partnerReactions(){ return null; },  // deliberately unavailable — that's the point
  async getFinds(){
    const { data } = await state.sb.from("discovered_ideas").select("*").eq("couple_id", state.coupleId).order("created_at",{ascending:false}).limit(120);
    return data || [];
  },
  async setArea(area){
    await state.sb.from("couples").update({ city: area.city, region: area.region ?? null, lat: area.lat ?? null, lng: area.lng ?? null }).eq("id", state.coupleId);
    state.area = area;
  },
  async sweep(){
    const cfg = getConfig();
    const { data: sess } = await state.sb.auth.getSession();
    const res = await fetch(`${cfg.supabaseUrl}/functions/v1/discover-dates`, {
      method: "POST",
      headers: { "Content-Type":"application/json", Authorization: `Bearer ${sess?.session?.access_token}` },
      body: JSON.stringify(state.area ? { city: state.area.city, region: state.area.region, lat: state.area.lat, lng: state.area.lng } : {}),
    });

    if (!res.ok) throw new Error(json.error || `Sweep failed (${res.status}). Is the discover-dates function deployed?`);
    state.lastSweep = new Date().toISOString();

      couple_id: state.coupleId, idea_key: plan.key, title: plan.title, blurb: plan.blurb,

    state.plan = null;
  },
  async completePlan(){
    if (!state.plan) return;
    await state.sb.from("saved_ideas").insert({
      couple_id: state.coupleId, title: state.plan.title, blurb: state.plan.blurb,
      meta: state.plan.meta, status: "done", created_by: state.user.id, done_at: new Date().toISOString(),

    state.log = [{ title: state.plan.title, blurb: state.plan.blurb, meta: state.plan.meta, done_at: new Date().toISOString() }, ...state.log];
    state.plan = null;
  },
};

  if (baked?.supabaseUrl && !/YOUR-PROJECT-REF/.test(baked.supabaseUrl)) return baked;
  const saved = lsGet(LS.cfg, null);
  if (saved?.supabaseUrl) return { ...saved, people: baked?.people || saved.people };
  return null;
}

/* ============================================================
   Card construction + hand dealing
   ============================================================ */
function deckCard(d){
  return {
    key: "deck:" + slug(d.t), title: d.t, blurb: d.b,
    meta: { vibe:d.v, budget:d.budget, setting:d.setting, time:d.time, em:d.em },
  };
}
function findCard(f){
  return {
    key: "found:" + f.id, title: f.title, blurb: f.blurb,
    meta: { vibe:f.vibe, budget:f.budget, setting:f.setting, time:f.time_of_day, em: VIBES[f.vibe]?.em || "✨" },
    source_label: f.source_label, source_url: f.source_url, sample: !!f.sample,
  };
}

// Affinity per vibe, from my own votes. Drives which cards I see more of.
function tasteFrom(reactions){
  const acc = {};
  for (const r of reactions||[]){
    const v = r.meta?.vibe; if (!v) continue;
    acc[v] = acc[v] || { yes:0, maybe:0, pass:0, n:0 };
    acc[v][r.reaction] = (acc[v][r.reaction]||0) + 1;
    acc[v].n++;
  }
  const out = {};
  for (const [v,c] of Object.entries(acc)) out[v] = { score: (c.yes + c.maybe*0.4) / Math.max(c.n,1), n: c.n };
  return out;
}

async function dealHand(){
  const mine = await api.myReactions();
  state.myReactions = mine;
  const seen = new Set(mine.map(r => r.key));
  const taste = tasteFrom(mine);

  const tier1 = (await api.pendingForMe())
    .filter(p => !seen.has(p.key))
    .map(p => ({ key:p.key, title:p.title, blurb:p.blurb, meta:p.meta || {}, converge:true }));

  const finds = await api.getFinds();
  state.finds = finds;
  const found = finds.map(findCard).filter(c => !seen.has(c.key));
  const tier2 = found.filter(c => !c.sample);   // real scouted finds
  const samples = found.filter(c => c.sample);  // placeholders, dealt last

  const tier3 = DECK.map(deckCard).filter(c => !seen.has(c.key));

  // Weight the unseen pools by taste, with enough randomness to stay surprising.
  const weight = c => (taste[c.meta?.vibe]?.score ?? 0.5) * 0.65 + Math.random() * 0.75;
  tier2.sort((a,b) => weight(b) - weight(a));
  tier3.sort((a,b) => weight(b) - weight(a));

  const hand = [];
  const push = arr => { for (const c of arr){ if (hand.length >= HAND_SIZE) return; if (!hand.some(h=>h.key===c.key)) hand.push(c); } };
  push(tier1.slice(0, 4));        // converge on what they've already judged
  push(tier2.slice(0, 4));        // fresh local finds
  push(tier3);                    // curated fallback
  push(tier2); push(tier1); push(samples);

  state.hand = hand;
  state.handIx = 0;
}

    ${cell("Budget", budgetLabel(meta?.budget))}

/* ============================================================
   BALLOT (Tonight)
   ============================================================ */
function renderTonight(){
  const panel = $("#panel-tonight");
  const card = state.hand[state.handIx];
  const p = state.progress || {};

  if (!card){
    const matches = state.consensus.filter(c => c.mine==="yes" && c.theirs==="yes").length;
    const theirTurn = Math.max(0, (p.myVotes||0) - (p.bothVoted||0));
    const waiting = p.waitingOnMe || 0;
    panel.innerHTML = `
      <h1 class="font-black wide text-[26px] leading-none tracking-[-0.02em]">Ballot complete</h1>
      <p class="mt-3 max-w-[46ch] text-[14.5px] leading-relaxed text-muted">
        ${p.myVotes||0} ideas marked. ${matches} match${matches===1?"":"es"} so far.</p>
      <div class="mt-6 border-2 border-ink">
        ${theirTurn > 0 ? `<div class="border-b border-rule px-4 py-3 font-mono text-[11px] leading-relaxed">
          <span class="text-muted">PENDING &middot;</span> ${esc(p.theirName||"Your partner")} hasn't marked ${theirTurn} of your picks. Results unlock as they do.</div>` : ""}
        ${waiting > 0 ? `<div class="border-b border-rule px-4 py-3 font-mono text-[11px] leading-relaxed" style="color:var(--warn)">
          <span class="text-muted">YOUR MOVE &middot;</span> ${waiting} idea${waiting===1?"":"s"} ${esc(p.theirName||"they")} already marked ${waiting===1?"is":"are"} waiting on you.</div>` : ""}
        <button id="dealMore" class="w-full bg-ink px-4 py-4 font-mono text-[11px] uppercase tracking-[0.14em] text-paper">Deal another ballot</button>
      </div>
      <button id="toConsensus" class="mt-2 w-full border border-ink px-4 py-3 font-mono text-[11px] uppercase tracking-[0.14em] hover:bg-ink hover:text-paper">See the results</button>
      ${tasteBlock()}`;
    $("#dealMore").addEventListener("click", async ()=>{ await dealHand(); renderTonight(); });
    $("#toConsensus").addEventListener("click", ()=>setTab("consensus"));
    return;
  }

  const n = String(state.handIx + 1).padStart(2,"0");
  const tot = String(state.hand.length).padStart(2,"0");

  const srcRight = card.sample
    ? `<span class="font-mono text-[10px] uppercase tracking-[0.1em]" style="color:var(--warn)">Sample</span>`
    : card.source_url
      ? `<a href="${esc(card.source_url)}" target="_blank" rel="noopener noreferrer"
            class="font-mono text-[10px] text-muted underline decoration-rule underline-offset-2 hover:text-accent">${esc(card.source_label||"source")} &#8599;</a>`
      : card.source_label
        ? `<span class="font-mono text-[10px] text-muted">${esc(card.source_label)}</span>` : "";

  panel.innerHTML = `
    <div class="flex items-baseline justify-between">
      <h1 class="font-black wide text-[26px] leading-none tracking-[-0.02em]">Tonight's ballot</h1>
      <span class="font-mono text-[12px] tabular-nums text-muted">${n}<span class="text-rule">/</span>${tot}</span>
    </div>
    <p class="mt-3 max-w-[46ch] text-[14.5px] leading-relaxed text-muted">
      Mark each one. Nothing is revealed until you have both voted on the same idea.</p>

    <div class="mt-4 flex gap-[3px]">
      ${state.hand.map((_,i)=>`<span class="h-[3px] flex-1 ${i < state.handIx ? "bg-accent" : i === state.handIx ? "bg-ink" : "bg-rule"}"></span>`).join("")}
    </div>

    <article class="anim-in mt-5 border-2 border-ink bg-raised">
      <div class="flex items-center justify-between gap-3 border-b border-rule px-4 py-2.5">
        ${codeChip(card.meta?.vibe)}
        ${card.converge ? `<span class="font-mono text-[10px] uppercase tracking-[0.1em] text-muted">Awaiting you</span>` : srcRight}
      </div>
      <div class="px-4 py-6">
        <h2 class="font-bold text-[clamp(22px,5.6vw,28px)] leading-[1.12] tracking-[-0.025em]">${esc(card.title)}</h2>
        ${card.blurb ? `<p class="mt-3 max-w-[44ch] text-[15px] leading-[1.6]">${esc(card.blurb)}</p>` : ""}
      </div>
      ${specRow(card.meta)}
      <div class="grid grid-cols-3 border-t-2 border-ink">
        <button id="vPass"  class="group border-r border-ink py-4 font-mono text-[11px] uppercase tracking-[0.12em] hover:bg-ink hover:text-paper">
          Pass <span class="ml-1 text-[9px] text-muted group-hover:text-paper">1</span></button>
        <button id="vMaybe" class="group border-r border-ink py-4 font-mono text-[11px] uppercase tracking-[0.12em] hover:bg-ink hover:text-paper">
          Maybe <span class="ml-1 text-[9px] text-muted group-hover:text-paper">2</span></button>
        <button id="vYes"   class="group py-4 font-mono text-[11px] uppercase tracking-[0.12em] hover:bg-accent hover:text-paper">
          Yes <span class="ml-1 text-[9px] text-muted group-hover:text-paper">3</span></button>
      </div>
    </article>
    ${tasteBlock()}`;

  $("#vPass").addEventListener("click", ()=>vote("pass"));
  $("#vMaybe").addEventListener("click", ()=>vote("maybe"));
  $("#vYes").addEventListener("click", ()=>vote("yes"));
}

async function vote(reaction){
  const card = state.hand[state.handIx];
  if (!card) return;
  await api.react(card, reaction);
  state.handIx++;
  await refreshDerived();
  if (reaction === "yes"){
    const hit = state.consensus.find(c => c.key === card.key && c.theirs === "yes");
    if (hit) toast(`Match — ${hit.theirName} said yes too`);
  }
  renderTonight();
}

function tasteBlock(){
  const taste = tasteFrom(state.myReactions);
  const rows = Object.entries(taste).filter(([,v]) => v.n > 0).sort((a,b) => b[1].score - a[1].score);
  const body = rows.length
    ? `<div class="space-y-2">${rows.map(([v,c]) => {
        const t = themeOf(v), pct = Math.round(c.score*100);
        return `<div class="grid grid-cols-[30px_1fr_38px] items-center gap-3">
          <span class="font-mono text-[11px] text-muted">${t.code}</span>
          <span class="h-[10px] w-full bg-rule"><span class="block h-full bg-accent" style="width:${pct}%"></span></span>
          <span class="text-right font-mono text-[11px] tabular-nums text-muted">${pct}%</span>
        </div>`;
      }).join("")}</div>`
    : emptyBox("Mark a few ideas and your profile builds itself here.");
  return sectionHead("Your taste", `${state.myReactions.length} vote${state.myReactions.length===1?"":"s"} · private to you`) + body;
}

/* ============================================================
   RESULTS (Consensus)
   ============================================================ */
function renderConsensus(){
  const panel = $("#panel-consensus");
  const p = state.progress || {};
  const matches = state.consensus.filter(c => c.mine==="yes" && c.theirs==="yes");
  const talk = state.consensus.filter(c =>
    (c.mine==="yes" && c.theirs==="maybe") || (c.mine==="maybe" && c.theirs==="yes") || (c.mine==="maybe" && c.theirs==="maybe"));

  panel.innerHTML = `
    <h1 class="font-black wide text-[26px] leading-none tracking-[-0.02em]">Results</h1>
    <p class="mt-3 max-w-[46ch] text-[14.5px] leading-relaxed text-muted">
      An idea appears here only once you have both marked it.</p>
    <div id="planSlot" class="mt-6"></div>
    <div class="mt-5 grid grid-cols-3 border border-rule">
      ${statCell(p.myVotes ?? 0, "your votes")}
      ${statCell(p.bothVoted ?? 0, "both voted")}
      ${statCell(matches.length, "matches", true)}
    </div>
    ${sectionHead("It's a match", "you both said yes")}
    <div id="matchList" class="space-y-2"></div>
    ${sectionHead("Worth a talk", "one yes, one maybe")}
    <div id="talkList" class="space-y-2"></div>
    ${sectionHead("How you compare", "")}
    <div id="compareBox"></div>
    ${sectionHead("Been there", "dates you actually went on")}
    <div id="logList" class="space-y-2"></div>`;

  renderPlan();

  $("#matchList").innerHTML = matches.length
    ? matches.map(c => matchRow(c, true)).join("")
    : emptyBox((p.bothVoted ?? 0) === 0
        ? "Nothing to reveal yet — you both need to mark the same idea first."
        : `No double-yes yet. You've both judged ${p.bothVoted} idea${p.bothVoted===1?"":"s"}.`);

  $("#talkList").innerHTML = talk.length
    ? talk.map(c => matchRow(c, false)).join("")
    : emptyBox("Ideas where one of you said yes and the other said maybe collect here.");

  panel.querySelectorAll("[data-pick]").forEach(btn => {
    btn.addEventListener("click", async ()=>{
      const c = state.consensus.find(x => x.key === btn.dataset.pick);
      if (!c) return;
      await api.setPlan({ key:c.key, title:c.title, blurb:c.blurb, meta:c.meta, scheduled_for:null });
      renderConsensus(); planDateSheet();
    });
  });

  renderCompare();
  renderLog();
}

function statCell(n, label, accent){
  return `<div class="border-r border-rule px-3 py-4 text-center last:border-r-0">
    <div class="font-black wide text-[27px] leading-none tabular-nums" ${accent?'style="color:var(--match)"':''}>${n}</div>
    <div class="mt-1.5 font-mono text-[9px] uppercase tracking-[0.12em] text-muted">${esc(label)}</div>
  </div>`;
}

function stamp(name, reaction, which){
  const colour = which === "me" ? "var(--accent)" : (state.mode === "local" ? personColorVar(which) : "var(--pb)");
  const word = { yes:"YES", maybe:"MAYBE", pass:"PASS" }[reaction] || reaction;
  const dim = reaction === "pass";
  return `<span class="inline-flex items-center gap-1.5 border px-2 py-1 font-mono text-[10px] uppercase tracking-[0.08em]"
    style="border-color:${dim?'var(--rule)':colour}; color:${dim?'var(--muted)':colour}">
    <b class="font-bold">${esc((name||"?").charAt(0).toUpperCase())}</b> ${word}</span>`;
}

function matchRow(c, isMatch){
  const meName = state.me?.name || "You";
  const themName = c.theirName || state.partner?.name || "Partner";
  return `<div class="border border-rule bg-raised">
    <div class="h-[3px]" style="background:${isMatch ? "var(--match)" : "var(--warn)"}"></div>
    <div class="px-4 py-4">
      <div class="flex items-center justify-between gap-3">
        ${codeChip(c.meta?.vibe, "text-muted")}
        <span class="font-mono text-[10px] text-muted">${esc(budgetLabel(c.meta?.budget))}</span>
      </div>
      <h4 class="mt-2 font-bold text-[17px] leading-[1.25] tracking-[-0.015em]">${esc(c.title)}</h4>
      ${c.blurb ? `<p class="mt-1.5 text-[13.5px] leading-relaxed text-muted">${esc(c.blurb.length>150 ? c.blurb.slice(0,147)+"…" : c.blurb)}</p>` : ""}
      <div class="mt-3 flex flex-wrap gap-1.5">
        ${stamp(meName, c.mine, "me")}
        ${stamp(themName, c.theirs, state.mode === "local" ? (L().active === "a" ? "b" : "a") : "them")}
      </div>
      <button data-pick="${esc(c.key)}" class="mt-3 w-full border border-ink py-2.5 font-mono text-[10px] uppercase tracking-[0.12em] hover:bg-ink hover:text-paper">Make this our next date</button>
    </div>
  </div>`;
}

function renderPlan(){
  const slot = $("#planSlot");
  if (!slot) return;
  if (!state.plan){
    slot.innerHTML = emptyBox("No date locked in. Pick one from your matches below.");
    return;
  }
  const when = state.plan.scheduled_for;
  const days = when ? Math.ceil((new Date(when+"T00:00:00") - new Date(new Date().toDateString()))/86400000) : null;
  const whenText = when
    ? new Date(when+"T00:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"})
      + (days!==null && days>=0 ? ` · ${days===0?"today":days===1?"tomorrow":"in "+days+" days"}` : "")
    : "no date set";
  slot.innerHTML = `
    <div class="border-2 border-ink bg-raised">
      <div class="flex items-center justify-between border-b border-rule px-4 py-2"
           style="background:var(--accent)">
        <span class="font-mono text-[10px] uppercase tracking-[0.14em] text-paper">Next date</span>
        <span class="font-mono text-[10px] text-paper">${esc(whenText)}</span>
      </div>
      <div class="px-4 py-5">
        <h2 class="font-bold text-[clamp(19px,4.8vw,24px)] leading-[1.15] tracking-[-0.02em]">${esc(state.plan.title)}</h2>
      </div>
      <div class="grid grid-cols-3 border-t border-rule">
        <button id="planDone"  class="border-r border-rule py-3 font-mono text-[10px] uppercase tracking-[0.1em] hover:bg-ink hover:text-paper">We did it</button>
        <button id="planWhen"  class="border-r border-rule py-3 font-mono text-[10px] uppercase tracking-[0.1em] hover:bg-ink hover:text-paper">${when ? "Change day" : "Pick a day"}</button>
        <button id="planClear" class="py-3 font-mono text-[10px] uppercase tracking-[0.1em] text-muted hover:bg-ink hover:text-paper">Unpick</button>
      </div>
    </div>`;
  $("#planDone").addEventListener("click", async ()=>{ await api.completePlan(); renderConsensus(); toast("Logged"); });
  $("#planWhen").addEventListener("click", planDateSheet);
  $("#planClear").addEventListener("click", async ()=>{ await api.clearPlan(); renderConsensus(); toast("Unpicked"); });
}

function renderCompare(){
  const box = $("#compareBox");
  if (!box) return;
  const mineT = tasteFrom(state.myReactions);
  // We can't read their raw votes (that's the point) — derive their
  // leanings from the ideas you've both judged, which we may see.
  const theirT = tasteFrom(state.consensus.map(c => ({ meta:c.meta, reaction:c.theirs })));
  const keys = [...new Set([...Object.keys(mineT), ...Object.keys(theirT)])]
    .filter(v => (mineT[v]?.n || 0) + (theirT[v]?.n || 0) > 0);

  if (!keys.length || !state.consensus.length){
    box.innerHTML = emptyBox("Once you've both marked a few of the same ideas, you'll see where your tastes agree — and where they really don't.");
    return;
  }
  const meName = state.me?.name || "You";
  const themName = state.partner?.name || state.consensus[0]?.theirName || "Partner";
  const mineColour = "var(--accent)";
  const theirColour = state.mode === "local" ? personColorVar(L().active === "a" ? "b" : "a") : "var(--pb)";

  const rows = keys.map(v => {
    const a = Math.round((mineT[v]?.score ?? 0)*100);
    const b = Math.round((theirT[v]?.score ?? 0)*100);
    return { v, t: themeOf(v), a, b, gap: Math.abs(a-b) };
  }).sort((x,y) => (y.a+y.b) - (x.a+x.b));

  const agree = rows.filter(r => r.gap <= 20)[0];
  const clash = rows.slice().sort((x,y) => y.gap - x.gap)[0];

  box.innerHTML = `
    <div class="mb-3 flex gap-4 font-mono text-[10px] uppercase tracking-[0.1em]">
      <span style="color:${mineColour}">&#9632; ${esc(meName)}</span>
      <span style="color:${theirColour}">&#9632; ${esc(themName)}</span>
    </div>
    <div class="space-y-2.5">
      ${rows.map(r => `
        <div class="grid grid-cols-[30px_1fr_50px] items-center gap-3">
          <span class="font-mono text-[11px] text-muted">${r.t.code}</span>
          <span class="grid gap-[3px]">
            <span class="h-[7px] w-full bg-rule"><span class="block h-full" style="width:${r.a}%;background:${mineColour}"></span></span>
            <span class="h-[7px] w-full bg-rule"><span class="block h-full" style="width:${r.b}%;background:${theirColour}"></span></span>
          </span>
          <span class="text-right font-mono text-[10px] tabular-nums text-muted">${r.a}/${r.b}</span>
        </div>`).join("")}
    </div>
    ${(agree || clash) ? `<p class="mt-4 border-l-2 border-rule pl-3 text-[13px] leading-relaxed text-muted">
      ${agree ? `Most in sync on <b class="font-semibold text-ink">${esc(agree.t.label.toLowerCase())}</b>.` : ""}
      ${clash && clash.gap > 25 ? ` Biggest split: <b class="font-semibold text-ink">${esc(clash.t.label.toLowerCase())}</b>.` : ""}
    </p>` : ""}`;
}

function renderLog(){
  const el = $("#logList");
  if (!el) return;
  el.innerHTML = state.log.length
    ? state.log.map(l => `<div class="flex items-baseline justify-between gap-3 border-b border-rule pb-2">
        <span class="text-[14px] leading-snug">${esc(l.title)}</span>
        <span class="shrink-0 font-mono text-[10px] text-muted">${l.done_at ? esc(new Date(l.done_at).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"})) : ""}</span>
      </div>`).join("")
    : emptyBox("Dates you actually go on land here.");
}

/* ============================================================
   SCOUT (Finds)
   ============================================================ */
function renderFinds(){
  const panel = $("#panel-finds");
  const all = state.finds || [];
  const filtered = state.findsFilter === "all" ? all : all.filter(f => f.source === state.findsFilter);
  const seen = new Set(state.myReactions.map(r => r.key));
  const label = { all:"All", reddit:"Reddit", blog:"Blogs" }[state.findsFilter];

  panel.innerHTML = `
    <h1 class="font-black wide text-[26px] leading-none tracking-[-0.02em]">Scout</h1>
    <p class="mt-3 max-w-[46ch] text-[14.5px] leading-relaxed text-muted">
      Reddit threads and local blogs, mined for things people actually recommend.</p>

    <div class="mt-6 flex items-stretch border border-rule">
      <div class="flex-1 px-4 py-3">
        <div class="font-mono text-[9px] uppercase tracking-[0.12em] text-muted">Area</div>
        <div class="mt-0.5 text-[15px] font-semibold">${state.area?.city ? esc([state.area.city, state.area.region].filter(Boolean).join(", ")) : "Not set"}</div>
        <div class="mt-0.5 font-mono text-[10px] text-muted">${state.area?.city ? "Last swept " + esc(timeAgo(state.lastSweep)) : "Set an area to start scouting"}</div>
      </div>
      <button id="areaBtn" class="border-l border-rule px-4 font-mono text-[10px] uppercase tracking-[0.1em] hover:bg-ink hover:text-paper">Change</button>
    </div>

    <div class="mt-2 flex gap-2">
      <button id="sweepBtn" class="flex-1 bg-ink py-3.5 font-mono text-[11px] uppercase tracking-[0.14em] text-paper">Sweep for new ideas</button>
      <button id="findsFilterBtn" class="border border-ink px-4 font-mono text-[10px] uppercase tracking-[0.1em] hover:bg-ink hover:text-paper">${label}</button>
    </div>

    ${sectionHead("Fresh finds", `${filtered.length} in the pool`)}
    <div id="findsList" class="space-y-2"></div>`;

  $("#findsList").innerHTML = filtered.length
    ? filtered.map(f => {
        const t = themeOf(f.vibe);
        const voted = seen.has("found:" + f.id);
        return `<div class="border border-rule bg-raised ${f.sample ? "" : ""}">
          ${f.sample ? `<div class="hatch h-[4px]"></div>` : ""}
          <div class="px-4 py-3">
            <div class="flex items-center justify-between gap-3">
              <span class="font-mono text-[10px] tracking-[0.1em] text-muted">${t.code} &middot; ${esc(t.label.toUpperCase())}</span>
              ${f.sample
                ? `<span class="font-mono text-[9px] uppercase tracking-[0.1em]" style="color:var(--warn)">Sample</span>`
                : f.source_url
                  ? `<a href="${esc(f.source_url)}" target="_blank" rel="noopener noreferrer" class="font-mono text-[10px] text-muted underline decoration-rule underline-offset-2 hover:text-accent">${esc(f.source_label)} &#8599;</a>`
                  : `<span class="font-mono text-[10px] text-muted">${esc(f.source_label||"")}</span>`}
            </div>
            <div class="mt-1.5 flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="text-[14.5px] font-semibold leading-snug">${esc(f.title)}</div>
                <div class="mt-1 font-mono text-[10px] text-muted">${esc(budgetLabel(f.budget))} &middot; ${esc(timeLabel(f.time_of_day))}</div>
              </div>
              ${voted
                ? `<span class="shrink-0 border border-rule px-2 py-1 font-mono text-[9px] uppercase text-muted">Voted</span>`
                : `<button data-queue="${esc(f.id)}" class="shrink-0 border border-ink px-2.5 py-1 font-mono text-[9px] uppercase tracking-wider hover:bg-ink hover:text-paper">Add</button>`}
            </div>
          </div>
        </div>`;
      }).join("")
    : emptyBox(state.mode === "local"
        ? "These are samples. Connect Supabase and deploy <code class='font-mono'>discover-dates</code> to scout your actual city."
        : "Nothing yet — hit <b>Sweep for new ideas</b>.");

  $("#areaBtn").addEventListener("click", areaSheet);
  $("#findsFilterBtn").addEventListener("click", ()=>{
    state.findsFilter = { all:"reddit", reddit:"blog", blog:"all" }[state.findsFilter];
    renderFinds();
  });
  $("#sweepBtn").addEventListener("click", doSweep);
  panel.querySelectorAll("[data-queue]").forEach(b => b.addEventListener("click", ()=>{
    const f = (state.finds||[]).find(x => String(x.id) === b.dataset.queue);
    if (!f) return;
    const c = findCard(f);
    if (state.hand.some(h => h.key === c.key)){ toast("Already in your ballot"); return; }
    state.hand.splice(state.handIx, 0, c);
    toast("Added to your ballot");
    setTab("tonight"); renderTonight();
  }));
}

async function doSweep(){
  const btn = $("#sweepBtn");
  if (!state.area?.city){ toast("Set your area first"); areaSheet(); return; }
  btn.disabled = true; btn.textContent = "Sweeping…";
  try {
    const r = await api.sweep();
    state.finds = await api.getFinds();
    const n = r?.results?.reduce((a,x)=>a+(x.inserted||0),0) ?? 0;
    toast(n ? `Found ${n} new idea${n===1?"":"s"}` : "Swept — nothing new");
    renderFinds();
  } catch(e){ toast(e.message || "Sweep failed"); btn.disabled = false; btn.textContent = "Sweep for new ideas"; }
}

/* ============================================================
   Sheets
   ============================================================ */
function openSheet(html){
  $("#sheetRoot").innerHTML = `
    <div id="scrim" class="fixed inset-0 z-[60] grid items-end justify-items-center scrim p-0 sm:items-center sm:p-4">
      <div role="dialog" aria-modal="true"
           class="anim-in max-h-[90vh] w-full max-w-lg overflow-y-auto border-2 border-ink bg-raised"
           style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px))">${html}</div>
    </div>`;
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.addEventListener("keydown", escClose);
}
function closeSheet(){ $("#sheetRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function escClose(e){ if (e.key === "Escape") closeSheet(); }
window.closeSheet = closeSheet;

function sheetHead(title, sub){
  return `<div class="flex items-start justify-between gap-4 border-b-2 border-ink px-5 py-4">
    <div>
      <h2 class="font-black wide text-[19px] leading-tight tracking-[-0.01em]">${esc(title)}</h2>
      ${sub ? `<p class="mt-1 text-[13px] leading-snug text-muted">${sub}</p>` : ""}
    </div>
    <button onclick="closeSheet()" class="shrink-0 border border-ink px-2 py-1 font-mono text-[10px] hover:bg-ink hover:text-paper" aria-label="Close">ESC</button>
  </div>`;
}
const fieldCls = "w-full border border-rule bg-paper px-3 py-2.5 text-[16px] text-ink focus:border-accent";
const labelCls = "mb-1.5 block font-mono text-[10px] uppercase tracking-[0.12em] text-muted";
const btnSolid = "w-full bg-ink py-3 font-mono text-[11px] uppercase tracking-[0.14em] text-paper";
const btnLine  = "w-full border border-ink py-3 font-mono text-[11px] uppercase tracking-[0.14em] hover:bg-ink hover:text-paper";
function note(kind, msg){
  const c = { err:"var(--pb)", ok:"var(--match)", warn:"var(--warn)", info:"var(--muted)" }[kind] || "var(--muted)";
  return `<div class="mt-3 border-l-2 px-3 py-2 text-[13px] leading-relaxed" style="border-color:${c};color:${kind==='info'?'var(--muted)':c}">${msg}</div>`;
}

function planDateSheet(){
  if (!state.plan) return;
  const today = new Date().toISOString().slice(0,10);
  openSheet(`${sheetHead("When are we doing this?", esc(state.plan.title))}
    <div class="px-5 py-5">
      <label class="${labelCls}" for="planDate">Date</label>
      <input type="date" id="planDate" class="${fieldCls}" min="${today}" value="${esc(state.plan.scheduled_for || "")}">
      <button id="savePlanDate" class="${btnSolid} mt-4">Lock it in</button>
    </div>`);
  $("#savePlanDate").addEventListener("click", async ()=>{
    const v = $("#planDate").value;
    await api.setPlan({ ...state.plan, scheduled_for: v || null });
    state.plan = { ...state.plan, scheduled_for: v || null };
    closeSheet(); renderConsensus(); toast("It's a date");
  });
}

function areaSheet(){
  openSheet(`${sheetHead("Where are you two?", "The scout searches your city's subreddit and local blogs.")}
    <div class="px-5 py-5">
      <button id="useLoc" class="${btnLine}">Use my current location</button>
      <div class="my-4 flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.1em] text-muted">
        <span class="h-px flex-1 bg-rule"></span>or type it<span class="h-px flex-1 bg-rule"></span></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${labelCls}" for="cityIn">City</label><input id="cityIn" class="${fieldCls}" value="${esc(state.area?.city||"")}" placeholder="Austin"></div>
        <div><label class="${labelCls}" for="regionIn">State</label><input id="regionIn" class="${fieldCls}" value="${esc(state.area?.region||"")}" placeholder="TX"></div>
      </div>
      <button id="saveArea" class="${btnSolid} mt-4">Save area</button>
      <div id="areaMsg"></div>
    </div>`);
  $("#useLoc").addEventListener("click", ()=>{
    const msg = $("#areaMsg");
    if (!navigator.geolocation){ msg.innerHTML = note("err","This browser has no location support."); return; }
    msg.innerHTML = note("info","Asking for your location…");
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude:lat, longitude:lng } = pos.coords;
      state.area = { ...(state.area||{}), lat, lng };
      try {
        const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
        const j = await r.json();
        $("#cityIn").value = j.city || j.locality || "";
        $("#regionIn").value = j.principalSubdivisionCode?.split("-").pop() || j.principalSubdivision || "";
        msg.innerHTML = note("ok","Found you — check it looks right, then save.");
      } catch {
        msg.innerHTML = note("warn","Got your coordinates, but the city lookup was blocked. Type the city in.");
      }
    }, err => {
      msg.innerHTML = note("err", err.code===1 ? "Location permission denied — type your city instead." : "Couldn't get your location.");
    }, { timeout: 10000 });
  });
  $("#saveArea").addEventListener("click", async ()=>{
    const city = $("#cityIn").value.trim(), region = $("#regionIn").value.trim();
    if (!city){ toast("City is required"); return; }
    await api.setArea({ city, region, lat: state.area?.lat ?? null, lng: state.area?.lng ?? null });
    closeSheet(); renderFinds(); toast("Area saved");
  });
}

function menuSheet(){
  if (state.mode === "backend" && state.user) return accountSheet();
  return localSettingsSheet();
}

function localSettingsSheet(){
  const d = L();
  openSheet(`${sheetHead("The two of you", "Both perspectives live on this device. Hand the phone over to switch.")}
    <div class="px-5 py-5">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${labelCls}" for="nameA">First person</label><input id="nameA" class="${fieldCls}" value="${esc(d.people[0].name)}"></div>
        <div><label class="${labelCls}" for="nameB">Second person</label><input id="nameB" class="${fieldCls}" value="${esc(d.people[1].name)}"></div>
      </div>
      <button id="saveNames" class="${btnSolid} mt-4">Save names</button>
      <div class="my-5 h-px bg-rule"></div>
      ${backendConfigured()
        ? `<p class="text-[13.5px] leading-relaxed text-muted">You're in demo mode — nothing syncs. Sign in to use the real thing.</p>
           <button id="toSignIn" class="${btnSolid} mt-3">Sign in</button>`
        : `<p class="text-[13.5px] leading-relaxed text-muted">Everything lives in this browser. Connect Supabase for real logins, enforced-blind voting and the live scout.</p>
           <button id="toBackend" class="${btnLine} mt-3">Connect a backend</button>`}
      <div class="mt-5 flex items-center justify-between border-t border-rule pt-4">
        <div><div class="text-[14px] font-semibold">Reset everything</div>
             <div class="font-mono text-[10px] text-muted">Clears both people's votes here</div></div>
        <button id="resetAll" class="border border-ink px-3 py-1.5 font-mono text-[10px] uppercase hover:bg-ink hover:text-paper">Reset</button>
      </div>
    </div>`);
  $("#saveNames").addEventListener("click", ()=>{
    const d2 = L();
    d2.people[0].name = $("#nameA").value.trim() || "Person 1";
    d2.people[1].name = $("#nameB").value.trim() || "Person 2";
    saveL(d2); closeSheet(); boot(); toast("Saved");
  });
  $("#toBackend")?.addEventListener("click", backendConfigSheet);
  $("#toSignIn")?.addEventListener("click", authSheet);
  $("#resetAll").addEventListener("click", ()=>{
    if (!confirm("Clear all votes, matches and plans on this device?")) return;
    saveL(blankLocal()); closeSheet(); boot(); toast("Reset");
  });
}

function backendConfigSheet(){
  const cfg = lsGet(LS.cfg, {}) || {};
  const baked = window.HARISHA_CONFIG || window.DATE_NIGHT_CONFIG;
  const fixed = !!(baked?.supabaseUrl && !/YOUR-PROJECT-REF/.test(baked.supabaseUrl));
  openSheet(`${sheetHead("Connect a backend", "From Supabase &rarr; Settings &rarr; API. Stored on this device only.")}
    <div class="px-5 py-5">
      ${fixed ? note("info","This copy already ships with a backend in <code class='font-mono'>config.js</code>.") : ""}
      <div class="mt-1"><label class="${labelCls}" for="sbUrl">Project URL</label><input id="sbUrl" class="${fieldCls}" value="${esc(cfg.supabaseUrl||"")}" placeholder="https://xxxx.supabase.co"></div>
      <div class="mt-3"><label class="${labelCls}" for="sbKey">Anon public key</label><input id="sbKey" class="${fieldCls}" value="${esc(cfg.supabaseAnonKey||"")}" placeholder="eyJhbGciOi…"></div>
      <button id="saveCfg" class="${btnSolid} mt-4">Save &amp; connect</button>
      ${note("info","Run <code class='font-mono'>supabase-schema.sql</code> in the SQL editor once before signing in.")}
    </div>`);
  $("#saveCfg").addEventListener("click", ()=>{
    const url = $("#sbUrl").value.trim(), key = $("#sbKey").value.trim();
    if (!url || !key){ toast("Both fields are required"); return; }
    lsSet(LS.cfg, { supabaseUrl:url, supabaseAnonKey:key });
    initSb();
    if (state.sb){ closeSheet(); authSheet(); } else toast("Couldn't initialise");
  });
}

/* ---------- Sign in: exactly two accounts ---------- */
function authSheet(){
  const ppl = people();
  const named = ppl.filter(p => p.email);
  const remembered = lsGet("hs_last_person", null);

  openSheet(`${sheetHead("Who's this?", "This site is for the two of you. Nobody else can hold an account.")}
    <div class="px-5 py-5">
    ${named.length === ppl.length ? `
      <div class="grid grid-cols-2 gap-3">
        ${ppl.map((p,i) => `
          <button id="pick${i}" class="border-2 py-5 font-black wide text-[17px] hover:text-paper"
                  style="border-color:${personColorVar(p.color)};color:${personColorVar(p.color)}"
                  onmouseover="this.style.background='${personColorVar(p.color)}'"
                  onmouseout="this.style.background='transparent'">${esc(p.name)}</button>`).join("")}
      </div>
      <div id="pwStage"></div>
    ` : `
      <div><label class="${labelCls}" for="email">Email</label><input id="email" type="email" autocomplete="email" class="${fieldCls}" value="${esc(remembered?.email || "")}"></div>
      <div class="mt-3"><label class="${labelCls}" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" class="${fieldCls}"></div>
      <button id="authGo" class="${btnSolid} mt-4">Sign in</button>
      <div id="authMsg"></div>
      ${note("info","First time? Create the two accounts in Supabase &rarr; Authentication &rarr; Users, with the addresses from <code class='font-mono'>supabase-schema.sql</code>.")}
    `}
      <div class="my-5 h-px bg-rule"></div>
      <button id="tryDemo" class="${btnLine}">Try the demo on this device</button>
    </div>`);

  $("#tryDemo").addEventListener("click", ()=>{ state.demo = true; closeSheet(); boot(); });
  if (named.length === ppl.length){
    ppl.forEach((p,i) => $(`#pick${i}`).addEventListener("click", ()=>passwordStage(p)));
    if (remembered?.email){
      const m = ppl.find(p => p.email.toLowerCase() === remembered.email.toLowerCase());
      if (m) passwordStage(m);
    }
  } else {
    $("#authGo").addEventListener("click", ()=>doAuth($("#email").value.trim(), $("#pw").value));
    $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") doAuth($("#email").value.trim(), $("#pw").value); });
  }
}

function passwordStage(person){
  const stage = $("#pwStage");
  if (!stage) return;
  stage.innerHTML = `
    <div class="mt-5"><label class="${labelCls}" for="pw">${esc(person.name)}&#39;s password</label>
      <input id="pw" type="password" autocomplete="current-password" class="${fieldCls}"></div>
    <button id="authGo" class="${btnSolid} mt-4">Sign in as ${esc(person.name)}</button>
    <div id="authMsg"></div>`;
  const go = () => doAuth(person.email, $("#pw").value);
  $("#authGo").addEventListener("click", go);
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("#pw").focus();
}

async function doAuth(email, pw){
  const msg = $("#authMsg"), btn = $("#authGo");
  if (!email || !pw){ if (msg) msg.innerHTML = note("err","Enter your password to continue."); return; }
  if (btn){ btn.disabled = true; btn.textContent = "Signing in…"; }
  try {
    const res = await state.sb.auth.signInWithPassword({ email, password: pw });
    if (res.error) throw res.error;
    state.user = res.data.user;
    lsSet("hs_last_person", { email });
    state.demo = false;
    closeSheet(); await boot(); toast("Welcome back");
  } catch(e){
    const net = /fetch|network|failed to fetch/i.test(e.message || "");
    if (msg) msg.innerHTML = note("err", net
      ? "Can't reach the database from here. The preview sandbox blocks outside connections — this works on the hosted site. Try the demo instead."
      : esc(e.message || "That didn't work."));
    if (btn){ btn.disabled = false; btn.textContent = "Sign in"; }
  }
}

function accountSheet(){
  openSheet(`${sheetHead(state.me?.name || "Your account",
      state.partner ? `Paired with ${esc(state.partner.name)}` : "Your partner hasn't signed in yet")}
    <div class="px-5 py-5">
      ${note("ok","Your votes are private. An idea reaches Results only once you've <em>both</em> marked it.")}
      <div class="mt-5 flex items-center justify-between border-t border-rule pt-4">
        <div><div class="text-[14px] font-semibold">Your area</div>
             <div class="font-mono text-[10px] text-muted">${esc(state.area?.city || "not set")}</div></div>
        <button id="areaFromMenu" class="border border-ink px-3 py-1.5 font-mono text-[10px] uppercase hover:bg-ink hover:text-paper">Change</button>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-rule pt-4">
        <div><div class="text-[14px] font-semibold">Backend keys</div>
             <div class="font-mono text-[10px] text-muted">Supabase project</div></div>
        <button id="editCfg2" class="border border-ink px-3 py-1.5 font-mono text-[10px] uppercase hover:bg-ink hover:text-paper">Edit</button>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-rule pt-4">
        <div><div class="text-[14px] font-semibold">Sign out</div>
             <div class="font-mono text-[10px] text-muted">on this device</div></div>
        <button id="signOut" class="border border-ink px-3 py-1.5 font-mono text-[10px] uppercase hover:bg-ink hover:text-paper">Sign out</button>
      </div>
    </div>`);
  $("#areaFromMenu").addEventListener("click", areaSheet);
  $("#editCfg2").addEventListener("click", backendConfigSheet);
  $("#signOut").addEventListener("click", async ()=>{
    try { await state.sb.auth.signOut(); } catch {}
    state.user = null; state.demo = false; closeSheet(); await boot(); toast("Signed out");
  });
}

/* ---------- Pass-the-phone curtain ---------- */
function handOff(toSlot){
  const d = L();
  const to = d.people.find(p => p.slot === toSlot);
  const from = d.people.find(p => p.slot !== toSlot);
  $("#curtainRoot").innerHTML = `
    <div class="fixed inset-0 z-[70] flex flex-col bg-paper">
      <div class="h-[38vh] w-full" style="background:${personColorVar(toSlot)}"></div>
      <div class="flex flex-1 flex-col justify-center px-6">
        <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-muted">Hand the phone over</p>
        <h2 class="mt-2 font-black wider text-[clamp(30px,10vw,48px)] leading-[0.95] tracking-[-0.03em]">${esc(to.name)}</h2>
        <p class="mt-4 max-w-[34ch] text-[14.5px] leading-relaxed text-muted">${esc(from.name)}'s votes are hidden from here on. No peeking.</p>
        <button id="curtainGo" class="${btnSolid} mt-7">I'm ${esc(to.name)} — my turn</button>
      </div>
    </div>`;
  $("#curtainGo").addEventListener("click", async ()=>{
    const dd = L(); dd.active = toSlot; saveL(dd);
    $("#curtainRoot").innerHTML = "";
    await boot();
  });
}

/* ---------- Front door ---------- */
function lockScreen(){
  const ppl = people();
  $("#curtainRoot").innerHTML = `
    <div class="fixed inset-0 z-[70] flex flex-col bg-paper">
      <div class="grid h-[30vh] grid-cols-2">
        ${ppl.slice(0,2).map(p => `
          <div class="flex items-end p-4" style="background:${personColorVar(p.color)}">
            <span class="font-black wider text-[clamp(16px,5vw,26px)] leading-none tracking-[-0.02em] text-paper">${esc(p.name.toUpperCase())}</span>
          </div>`).join("")}
      </div>
      <div class="flex flex-1 flex-col justify-center px-6">
        <h1 class="font-black wider text-[clamp(34px,12vw,60px)] leading-[0.9] tracking-[-0.035em]">HARISHA</h1>
        <p class="mt-4 max-w-[34ch] text-[14.5px] leading-relaxed text-muted">
          A date planner for exactly two people. Everyone else is just visiting.</p>
        <button id="lockIn" class="${btnSolid} mt-7">Sign in</button>
        <button id="lockDemo" class="${btnLine} mt-2">Have a look around instead</button>
      </div>
    </div>`;
  $("#lockIn").addEventListener("click", authSheet);
  $("#lockDemo").addEventListener("click", ()=>{ state.demo = true; $("#curtainRoot").innerHTML=""; boot(); });
}

/* ============================================================
   Tabs / theme / header
   ============================================================ */
function setTab(t){
  state.tab = t; lsSet(LS.tab, t);
  for (const k of ["tonight","consensus","finds"]){
    $(`#panel-${k}`).hidden = (k !== t);
    $(`#tab-${k}`).setAttribute("aria-selected", String(k === t));
  }
  window.scrollTo({ top: 0 });
  if (t === "finds") renderFinds();
  if (t === "consensus") renderConsensus();
  if (t === "tonight") renderTonight();
}
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  lsSet(LS.theme, t);
}
function currentTheme(){
  return document.documentElement.getAttribute("data-theme")
    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function renderHeader(){
  const sw = $("#personSwitch");
  if (state.mode === "local"){
    const d = L();
    sw.hidden = false;
    sw.innerHTML = d.people.map(p => {
      const on = p.slot === d.active;
      return `<button data-slot="${p.slot}" aria-pressed="${on}" title="${esc(p.name)}"
        class="border border-ink px-2.5 py-1 font-mono text-[11px] font-bold -ml-px first:ml-0"
        style="${on ? `background:${personColorVar(p.slot)};color:var(--paper);border-color:${personColorVar(p.slot)}` : "color:var(--muted)"}"
        >${esc((p.name||"?").trim().charAt(0).toUpperCase())}</button>`;
    }).join("");
    sw.querySelectorAll("button").forEach(b => b.addEventListener("click", ()=>{
      if (b.dataset.slot === L().active) return;
      handOff(b.dataset.slot);
    }));
    document.documentElement.setAttribute("data-person", d.active);
    $("#whoLine").textContent = backendConfigured() ? "demo · not synced" : "pass-the-phone";
  } else {
    sw.hidden = true;
    document.documentElement.setAttribute("data-person", state.me?.color === "rose" ? "b" : "a");
    $("#whoLine").textContent = state.partner
      ? `${state.me?.name} & ${state.partner.name}`
      : `${state.me?.name || "signed in"} · solo`;
  }
}

/* ============================================================
   Boot
   ============================================================ */
function initSb(){
  const cfg = getConfig();
  if (!cfg || !window.supabase?.createClient){ state.sb = null; return; }
  try { state.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey); }
  catch { state.sb = null; }
}
async function refreshDerived(){
  state.myReactions = await api.myReactions();
  state.consensus = await api.consensus();
  state.progress = await api.progress();
}

async function boot(){
  applyTheme(lsGet(LS.theme, "system"));

  state.mode = "local"; api = localApi; state.user = null;
  if (backendConfigured()){
    initSb();
    if (state.sb){
      try {
        const { data } = await state.sb.auth.getSession();
        if (data?.session){ state.user = data.session.user; state.mode = "backend"; api = backendApi; }
      } catch { /* fall through */ }
    }
    // Configured but signed out: hold at the front door unless they
    // deliberately asked for the demo.
    if (!state.user && !state.demo){ lockScreen(); return; }
  }
  $("#curtainRoot").innerHTML = "";

  try {
    await api.init();
  } catch (e) {
    console.warn("backend init failed, falling back to demo", e);
    state.mode = "local"; api = localApi; state.user = null; state.demo = true;
    await api.init();
    toast("Can't reach the database — demo mode");
  }

  await refreshDerived();
  await dealHand();
  renderHeader();
  setTab(lsGet(LS.tab, "tonight"));
}

/* ---------- static wiring ---------- */
$("#themeBtn").addEventListener("click", ()=>applyTheme(currentTheme()==="dark" ? "light" : "dark"));
$("#menuBtn").addEventListener("click", menuSheet);
$("#tab-tonight").addEventListener("click", ()=>setTab("tonight"));
$("#tab-consensus").addEventListener("click", ()=>setTab("consensus"));
$("#tab-finds").addEventListener("click", ()=>setTab("finds"));

// Voting is repetitive, so it gets keys: 1 pass, 2 maybe, 3 yes.
document.addEventListener("keydown", e => {
  if (state.tab !== "tonight") return;
  if ($("#sheetRoot").innerHTML || $("#curtainRoot").innerHTML) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  const k = { "1":"pass", "2":"maybe", "3":"yes" }[e.key];
  if (k){ e.preventDefault(); vote(k); }
});

boot();
</script>
